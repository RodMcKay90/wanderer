name: Build Kay images

# Builds the customised images for this fork and publishes them to
# ghcr.io/<owner>/wanderer-db and ghcr.io/<owner>/wanderer-web.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: kay-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'open-wanderer'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [db, web]
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.component }}
        run: |
          docker buildx build ${{ matrix.component }}/ \
            -t ghcr.io/$OWNER/wanderer-${{ matrix.component }}:latest \
            -t ghcr.io/$OWNER/wanderer-${{ matrix.component }}:${GITHUB_SHA::7} \
            --cache-from type=gha,scope=${{ matrix.component }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.component }} \
            --push
